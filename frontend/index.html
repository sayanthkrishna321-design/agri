    // Geological & GIS Telemetry Data Calculator
    window.getGeologicalProfile = function(lat, lon) {
      const latNum = Number(lat) || 30.9010;
      const lonNum = Number(lon) || 75.8573;

      let soilType = "Indo-Gangetic Deep Alluvial Sandy Loam";
      let soilFamily = "Sutlej River Floodplain Series";
      let riverBasin = "Sutlej-Yamuna Alluvial Floodplain";
      let elevation = (220 + (Math.abs(latNum * 10) % 45)).toFixed(0) + "m MSL";
      let slope = "0.8% (Flat Floodplain)";
      let nitrogen = "240 kg/ha (Medium)";
      let phosphorus = "48 kg/ha (High)";
      let potassium = "210 kg/ha (High)";
      let ph = "7.4 (Slightly Alkaline)";
      let ndvi = (0.76 + (Math.sin(latNum) * 0.04)).toFixed(2);
      let sarWater = (38.4 + (Math.cos(lonNum) * 5.0)).toFixed(1) + "%";

      if (latNum < 25.0) {
        soilType = "Malwa Plateau Deep Black Cotton Soil (Vertisol)";
        soilFamily = "Narmada Vertisol Complex";
        riverBasin = "Narmada-Kshipra River Basin";
        elevation = (510 + (Math.abs(latNum * 12) % 80)).toFixed(0) + "m MSL";
        slope = "2.1% (Undulating Terrain)";
        nitrogen = "190 kg/ha (Low-Med)";
        phosphorus = "32 kg/ha (Medium)";
        potassium = "320 kg/ha (Very High)";
        ph = "7.8 (Alkaline Vertisol)";
        ndvi = "0.68";
        sarWater = "18.4%";
      } else if (latNum < 28.0) {
        soilType = "Karnal-Yamuna Alluvial Silt Loam";
        soilFamily = "Western Yamuna Plain Series";
        riverBasin = "Upper Yamuna Catchment";
        elevation = "245m MSL";
        slope = "1.1% (Gentle Slope)";
        nitrogen = "225 kg/ha (Med)";
        phosphorus = "52 kg/ha (High)";
        potassium = "240 kg/ha (High)";
        ph = "7.2 (Neutral Alkaline)";
        ndvi = "0.81";
        sarWater = "42.1%";
      }

      return {
        soilType,
        soilFamily,
        riverBasin,
        elevation,
        slope,
        nitrogen,
        phosphorus,
        potassium,
        ph,
        ndvi,
        sarWater
      };
    };

    // ── Insurance Premium Calculator (Risk-Based, GIS + Weather) ──────────
    window.calculatePremium = function(lat, lon, cropName, landHectares, cropValuePerHa) {
      const geo   = window.getGeologicalProfile(lat, lon);
      const wx    = window.state.weather;
      const latN  = Number(lat)  || 30.9010;
      const lonN  = Number(lon)  || 75.8573;
      const ha    = Number(landHectares)  || 1;
      const valHa = Number(cropValuePerHa) || 50000;   // ₹/hectare insured value

      // ── Base rate by crop (PMFBY actuarial reference) ───────────────────
      const cropRates = {
        'Wheat':   0.015, 'Rice':    0.020, 'Maize':   0.025,
        'Cotton':  0.035, 'Soybean': 0.030, 'Chana':   0.025,
        'Sugarcane': 0.018, 'default': 0.022
      };
      const cropKey = Object.keys(cropRates).find(k => cropName && cropName.toLowerCase().includes(k.toLowerCase())) || 'default';
      let baseRate = cropRates[cropKey];

      // ── Geo Risk Multipliers ─────────────────────────────────────────────
      let geoMultiplier = 1.0;
      // Slope risk
      if (geo.slope && geo.slope.includes('2.1')) geoMultiplier += 0.08;  // undulating
      if (geo.slope && geo.slope.includes('0.8')) geoMultiplier -= 0.02;  // flat floodplain
      // Soil water-holding / drought risk
      const moisture = parseFloat(geo.sarWater) || 38;
      if (moisture < 20) geoMultiplier += 0.12;   // drought-prone (Malwa Vertisol)
      else if (moisture > 40) geoMultiplier += 0.06; // flood-prone
      // NDVI crop stress
      const ndvi = parseFloat(geo.ndvi) || 0.76;
      if (ndvi < 0.65) geoMultiplier += 0.10;   // stressed crop
      else if (ndvi > 0.80) geoMultiplier -= 0.04;  // healthy
      // Elevation flood risk (low elevation = higher flood)
      const elev = parseFloat(geo.elevation) || 220;
      if (elev < 200) geoMultiplier += 0.05;

      // ── Weather Risk Multipliers ─────────────────────────────────────────
      let wxMultiplier = 1.0;
      const precip = wx.precipMm || 18;
      const wind   = wx.windKmh  || 16;
      const tempMax = wx.tempMax || 32;
      if (precip > 30)  wxMultiplier += 0.15;   // heavy rain risk
      else if (precip < 5) wxMultiplier += 0.08; // drought risk
      if (wind > 30)    wxMultiplier += 0.10;   // cyclone/wind risk
      if (tempMax > 40) wxMultiplier += 0.08;   // heat stress risk

      // ── Zone risk factor based on lat/lon band ───────────────────────────
      let zoneFactor = 1.0;
      if (latN < 20) zoneFactor = 1.25;        // Peninsular (flood/cyclone)
      else if (latN < 25) zoneFactor = 1.15;   // Central (Vertisol drought)
      else if (latN < 30) zoneFactor = 1.05;   // NW Plains
      else zoneFactor = 1.00;                  // Punjab/Haryana (well irrigated)

      // ── Final effective rate ─────────────────────────────────────────────
      const effectiveRate = baseRate * geoMultiplier * wxMultiplier * zoneFactor;
      const annualPremium = ha * valHa * effectiveRate;
      const monthlyPremium = annualPremium / 12;
      const sumInsured = ha * valHa;
      // Farmer share under PMFBY (2% Kharif / 1.5% Rabi, rest subsidised)
      const pmfbyFarmerShareRate = cropKey === 'Cotton' ? 0.05 : (cropKey === 'Wheat' ? 0.015 : 0.02);
      const pmfbyAnnual = sumInsured * pmfbyFarmerShareRate;
      const pmfbyMonthly = pmfbyAnnual / 12;

      // ── Risk Score (0-100) ───────────────────────────────────────────────
      const riskScore = Math.min(100, Math.round(
        (geoMultiplier - 1) * 200 + (wxMultiplier - 1) * 200 + (zoneFactor - 1) * 100 + baseRate * 1000
      ));
      const riskLabel = riskScore < 25 ? 'LOW' : riskScore < 50 ? 'MODERATE' : riskScore < 75 ? 'HIGH' : 'VERY HIGH';
      const riskColor = riskScore < 25 ? '#065F46' : riskScore < 50 ? '#92400E' : riskScore < 75 ? '#B45309' : '#991B1B';

      return {
        cropName, ha, valHa, sumInsured,
        baseRate: (baseRate * 100).toFixed(2),
        effectiveRate: (effectiveRate * 100).toFixed(3),
        annualPremium: Math.round(annualPremium),
        monthlyPremium: Math.round(monthlyPremium),
        pmfbyAnnual: Math.round(pmfbyAnnual),
        pmfbyMonthly: Math.round(pmfbyMonthly),
        geoMultiplier: geoMultiplier.toFixed(3),
        wxMultiplier: wxMultiplier.toFixed(3),
        zoneFactor: zoneFactor.toFixed(2),
        riskScore, riskLabel, riskColor,
        soilType: geo.soilType, riverBasin: geo.riverBasin,
        ndvi: geo.ndvi, sarWater: geo.sarWater,
        slope: geo.slope, elevation: geo.elevation
      };
    };

      window.renderMainViewOnly();

    window.renderFallbackGISRadarMap = function(container, lat, lon, geo) {
      if (!container) return;
      container.innerHTML = `
        <div class="w-full h-full bg-slate-950 text-white relative overflow-hidden flex flex-col justify-between p-4 font-mono select-none cursor-pointer" onclick="const clickLat=Number((${lat} + (Math.random()-0.5)*0.01).toFixed(4)); const clickLon=Number((${lon} + (Math.random()-0.5)*0.01).toFixed(4)); window.updateGeologicalDataAndMap(clickLat, clickLon);">

          <div class="absolute inset-0 bg-[linear-gradient(to_right,#1e293b_1px,transparent_1px),linear-gradient(to_bottom,#1e293b_1px,transparent_1px)] bg-[size:24px_24px] opacity-40"></div>

    // Interactive Leaflet Moving Map Engine
    window.initOrUpdateLeafletMap = function(lat, lon) {
      const mapContainer = document.getElementById('leaflet-moving-map');
      if (!mapContainer) return;

      const latNum = Number(lat) || 30.9010;
      const lonNum = Number(lon) || 75.8573;
      const geo = window.getGeologicalProfile(latNum, lonNum);

      // Clean up detached map instance
      if (window.leafletInstance) {
        if (!document.body.contains(window.leafletInstance._container)) {
          try { window.leafletInstance.remove(); } catch(e) {}
          window.leafletInstance = null;
        } else {
          try {
            window.leafletInstance.setView([latNum, lonNum], 13);
            if (window.leafletMarker) {
              window.leafletMarker.setLatLng([latNum, lonNum]);
              window.leafletMarker.bindPopup(`
                <div class="font-mono text-xs p-1">
                  <b class="text-slate-900 block mb-1">🛰️ PARCEL #PB-${Math.floor(latNum*100)}-${Math.floor(lonNum*100)}</b>
                  <div>📍 Coords: ${latNum.toFixed(4)}° N, ${lonNum.toFixed(4)}° E</div>
                  <div>🌱 Soil: ${geo.soilType}</div>
                  <div class="text-emerald-700 font-bold mt-1">● Sentinel-2 NDVI: ${geo.ndvi}</div>
                </div>
              `).openPopup();
            }
            setTimeout(() => { try { window.leafletInstance.invalidateSize(); } catch(err) {} }, 100);
            return;
          } catch(e) {
            console.log("Reinitializing Leaflet map instance...", e);
            window.leafletInstance = null;
          }
        }
      }

      // Initialize Leaflet map on active container
      if (typeof L !== 'undefined') {
        try {
          mapContainer.innerHTML = '';
          const map = L.map(mapContainer).setView([latNum, lonNum], 13);
          window.leafletInstance = map;

          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap | AgriSentinel X Moving GIS Map'
          }).addTo(map);

          const marker = L.marker([latNum, lonNum]).addTo(map);
          window.leafletMarker = marker;

          // Render all saved location pins on map
          if (window.state.savedLocations && Array.isArray(window.state.savedLocations)) {
            window.state.savedLocations.forEach(loc => {
              if (Math.abs(Number(loc.lat) - latNum) < 0.0001 && Math.abs(Number(loc.lon) - lonNum) < 0.0001) return;
              const locGeo = window.getGeologicalProfile(loc.lat, loc.lon);
              const locM = L.marker([Number(loc.lat), Number(loc.lon)]).addTo(map);
              locM.bindPopup(`
                <div class="font-mono text-xs p-1">
                  <b class="text-[#064E3B] block mb-1">📍 ${loc.name}</b>
                  <div>📍 Coords: ${Number(loc.lat).toFixed(4)}° N, ${Number(loc.lon).toFixed(4)}° E</div>
                  <div>🌱 Soil: ${locGeo.soilType}</div>
                  <div class="mt-2 flex space-x-1">
                    <button onclick="window.updateGeologicalDataAndMap(${loc.lat}, ${loc.lon})" class="bg-slate-900 text-white font-bold text-[10px] px-2 py-1 uppercase">🎯 PAN TO THIS FARM</button>
                    <button onclick="window.removeSavedLocation('${loc.id}', event)" class="bg-red-50 text-red-700 font-bold text-[10px] px-2 py-1 uppercase">🗑️ REMOVE</button>
                  </div>
                </div>
              `);
            });
          }

          marker.bindPopup(`
            <div class="font-mono text-xs p-1">
              <b class="text-slate-900 block mb-1">🛰️ ACTIVE PARCEL #PB-${Math.floor(latNum*100)}-${Math.floor(lonNum*100)}</b>
              <div>📍 Coords: ${latNum.toFixed(4)}° N, ${latNum.toFixed(4)}° E</div>
              <div>🌱 Soil: ${geo.soilType}</div>
              <div class="text-emerald-700 font-bold mt-1">● Sentinel-2 NDVI: ${geo.ndvi}</div>
            </div>
          `).openPopup();

          map.on('click', function(e) {
            const clickLat = Number(e.latlng.lat.toFixed(4));
            const clickLon = Number(e.latlng.lng.toFixed(4));
            window.state.latitude = clickLat;
            window.state.longitude = clickLon;

            const latInput = document.getElementById('gis-lat');
            const lonInput = document.getElementById('gis-lon');
            if (latInput) latInput.value = clickLat;
            if (lonInput) lonInput.value = clickLon;

            window.updateGeologicalDataAndMap(clickLat, clickLon);
          });

          setTimeout(() => {
            try { map.invalidateSize(); } catch(err) {}
          }, 200);
          return;
        } catch(err) {
          console.log("Leaflet map setup notice:", err);
        }
      }

      // Fallback high-tech vector radar renderer
      window.renderFallbackGISRadarMap(mapContainer, latNum, lonNum, geo);
    };

    // AI Insurance Claim Audit Verification Handler
    window.verifyClaimWithAI = async function(e) {
      if (e) e.preventDefault();

      const lat = Number(document.getElementById('gis-lat')?.value) || window.state.latitude || 30.9010;
      const lon = Number(document.getElementById('gis-lon')?.value) || window.state.longitude || 75.8573;
      const crop = document.getElementById('gis-crop')?.value || 'Grade A+ Sharbati Wheat';
      const cause = document.getElementById('gis-cause')?.value || 'Flood / Excess Rain';
      const lossDate = document.getElementById('gis-date')?.value || '2026-03-28';
      const acreage = Number(document.getElementById('gis-acreage')?.value) || 5.0;
      const policyId = document.getElementById('gis-policy')?.value || 'PMFBY-2026-PB-88912';
      const ratePerAcre = Number(document.getElementById('gis-rate')?.value) || 45000;

      window.state.latitude = lat;
      window.state.longitude = lon;
      window.state.isAnalyzingClaim = true;
      window.renderMainViewOnly();

      let aiAnswer = "";
      let aiCitations = [];

      try {
        const res = await apiFetch('/agent/query/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            query: `Audit PMFBY crop insurance claim for ${crop} damaged by ${cause} at location Lat ${lat}, Lon ${lon} on date ${lossDate}. Policy: ${policyId}, Acreage: ${acreage} Acres. Provide PMFBY clause recommendations and payout calculation.`,
            latitude: lat,
            longitude: lon,
            crop_name: crop,
            claimed_cause: cause,
            start_date: lossDate,
            end_date: lossDate,
            policy_id: policyId,
            land_holding_hectares: acreage * 0.404686
          })
        });

        if (res.ok) {
          const data = await res.json();
          aiAnswer = data.answer || "";
          if (data.sources) {
            aiCitations = data.sources.map(s => s.title || s);
          }
        }
      } catch(err) {
        console.log("Backend query notice, running PMFBY verification fallback engine", err);
      }

      const calculatedPayout = acreage * ratePerAcre;
      const geo = window.getGeologicalProfile(lat, lon);

      window.state.activeClaimResult = {
        crop,
        cause,
        lossDate,
        acreage,
        policyId,
        ratePerAcre,
        payout: calculatedPayout,
        lat,
        lon,
        score: '96.4%',
        noticeWindow: 'COMPLIANT (Filed within 36 hrs of loss incident)',
        sarEvidence: `DEMO DATA ONLY: simulated SAR waterlogging index ${geo.sarWater}; no satellite imagery was queried.`,
        precipAnomaly: 'DEMO DATA ONLY: rainfall values are illustrative and were not retrieved from a weather service.',
        clause: 'Demonstration only — confirm current PMFBY terms and claim eligibility with your insurer.',
        recommendation: aiAnswer || `This is a demonstration estimate only, not an eligibility decision or promise of payment. The sample estimate of ₹${calculatedPayout.toLocaleString('en-IN')} uses the acreage and rate entered above. An insurer must assess the actual policy and verified evidence.`,
        citations: aiCitations.length ? aiCitations : ['Synthetic demonstration map values', 'Synthetic demonstration weather values']
      };

      window.state.isAnalyzingClaim = false;
      window.renderMainViewOnly();
    };

    // Authentication & Role Routing Logic
    const USER_STATE_KEYS = ['crops', 'offers', 'orders', 'insuranceCases', 'savedLocations', 'chatMessages', 'latitude', 'longitude', 'activeClaimResult'];
    function getUserStateSnapshot() {
      const snapshot = {};
      USER_STATE_KEYS.forEach(key => { if (window.state[key] !== undefined) snapshot[key] = window.state[key]; });
      // Do not persist embedded image payloads or other large data URLs.
      if (Array.isArray(snapshot.crops)) snapshot.crops = snapshot.crops.map(crop => ({ ...crop, image: typeof crop.image === 'string' && crop.image.startsWith('data:') ? '' : crop.image }));
      return snapshot;
    }
    function scheduleSupabaseStateSave() {
      if (!supabaseClient || !currentSupabaseUserId || isHydratingSupabaseState) return;
      clearTimeout(supabaseSaveTimer);
      supabaseSaveTimer = setTimeout(async () => {
        const { error } = await supabaseClient.from('user_app_state').upsert({ user_id: currentSupabaseUserId, state: getUserStateSnapshot(), updated_at: new Date().toISOString() }, { onConflict: 'user_id' });
        if (error) console.error('Could not save account data to Supabase:', error.message);
      }, 700);
    }
    async function loadSupabaseUserState(userId) {
      currentSupabaseUserId = userId;
      isHydratingSupabaseState = true;
      // New accounts start with private, empty collections instead of shared demo records.
      window.state.crops = [];
      window.state.offers = [];
      window.state.orders = [];
      window.state.insuranceCases = [];
      window.state.savedLocations = [];
      window.state.chatMessages = [];
      const { data, error } = await supabaseClient.from('user_app_state').select('state').eq('user_id', userId).maybeSingle();
      if (error) {
        console.error('Could not load account data from Supabase:', error.message);
        window.state.loginError = 'Your account signed in, but its data could not be loaded. Check the Supabase table setup.';
      } else if (data?.state && typeof data.state === 'object') {
        USER_STATE_KEYS.forEach(key => { if (Object.prototype.hasOwnProperty.call(data.state, key)) window.state[key] = data.state[key]; });
      }
      isHydratingSupabaseState = false;
      scheduleSupabaseStateSave();
    }
    function enterSupabaseSession(user, selectedRole) {
      const role = ['farmer', 'retailer'].includes(selectedRole) ? selectedRole : 'farmer';
      window.state.isLoggedIn = true;
      window.state.currentUser = user.email || user.id;
      window.state.displayName = user.user_metadata?.full_name || user.email || (role === 'retailer' ? 'Retailer' : 'Farmer');
      window.state.role = role;
      window.state.currentView = role === 'retailer' ? 'retailer-dash' : 'farmer-dash';
      return loadSupabaseUserState(user.id).then(() => window.renderApp());
    }

      const passwordInput = document.getElementById('login-password');
      if (emailInput) emailInput.value = email;

    window.handleSupabaseSignup = async function(e) {
      if (e) e.preventDefault();
      if (!supabaseClient) return;
      const email = document.getElementById('login-username')?.value.trim();
      const password = document.getElementById('login-password')?.value;
      if (!email || !password) { window.state.loginError = 'Enter an email address and password to create your account.'; window.renderMainViewOnly(); return; }
      const role = ['farmer', 'retailer'].includes(window.state.selectedLoginRole) ? window.state.selectedLoginRole : 'farmer';
      const { data, error } = await supabaseClient.auth.signUp({ email, password, options: { emailRedirectTo: window.location.origin, data: { role } } });
      if (error) {
        window.state.loginError = /already registered|user already registered/i.test(error.message || '')
          ? 'This email already has an account. Sign in with it instead.'
          : error.message;
        window.renderMainViewOnly();
        return;
      }
      if (data.session) await enterSupabaseSession(data.session.user, role);
      else { window.state.loginError = 'Account created. Sign in with your email and password.'; window.renderMainViewOnly(); }
    };
    window.handleLoginSubmit = async function(e) {
      if (e) e.preventDefault();
      const usernameInput = document.getElementById('login-username')?.value.trim();
      const passwordInput = document.getElementById('login-password')?.value;

      if (!usernameInput || !passwordInput) {
        window.state.loginError = "Please fill in both username and password fields.";
        window.renderMainViewOnly();
        return;
      }

      window.state.loginError = "";

      if (supabaseClient) {
        const role = ['farmer', 'retailer'].includes(window.state.selectedLoginRole) ? window.state.selectedLoginRole : 'farmer';
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email: usernameInput, password: passwordInput });
        if (error) {
          window.state.loginError = /email not confirmed|invalid login credentials/i.test(error.message || '')
            ? 'Email or password is incorrect.'
            : error.message;
          window.renderMainViewOnly();
          return;
        }
        await enterSupabaseSession(data.user, role);
        return;
      }

      // Capture custom Location Login input coordinates
      const latVal = Number(document.getElementById('login-lat')?.value);
      const lonVal = Number(document.getElementById('login-lon')?.value);
      const locNameVal = document.getElementById('login-loc-name')?.value?.trim();

      if (!isNaN(latVal) && !isNaN(lonVal) && latVal !== 0) {
        window.state.latitude = latVal;
        window.state.longitude = lonVal;
        if (locNameVal) {
          const exists = (window.state.savedLocations || []).some(l => l.name === locNameVal || (l.lat === latVal && l.lon === lonVal));
          if (!exists) {
            if (!window.state.savedLocations) window.state.savedLocations = [];
            window.state.savedLocations.unshift({
              id: `loc-${Date.now()}`,
              name: locNameVal,
              lat: latVal,
              lon: lonVal,
              crop: 'Primary Login Farm Parcel'
            });
          }
        }
      }

      try {
        const res = await apiFetch('/login/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: usernameInput, password: passwordInput })
        });

        if (res.ok) {
          const data = await res.json();
          window.state.isLoggedIn = true;
          window.state.currentUser = data.username;
          window.state.role = data.role.toLowerCase();
          window.state.displayName = data.name;
          window.state.userLocation = data.location;
          
          if (window.state.role === 'farmer') {
            window.state.currentView = 'farmer-dash';
          } else if (window.state.role === 'retailer') {
            window.state.currentView = 'retailer-dash';
          } else if (window.state.role === 'admin') {
            window.state.currentView = 'admin-dash';
          }
          window.renderApp();
          return;
        } else {
          const errData = await res.json().catch(() => ({}));
          window.state.loginError = errData.error || "Authentication failed. Check credentials.";
          window.renderMainViewOnly();
          return;
        }
      } catch (err) {
        console.log("Using standalone authentication routing fallback", err);
      }

      // Standalone Fallback Role Routing
      const u = usernameInput.toLowerCase();
      if (u === 'farmer' || u === 'kisan_coop') {
        window.state.isLoggedIn = true;
        window.state.currentUser = u;
        window.state.role = 'farmer';
        window.state.displayName = 'Kisan Organics Co-op #04';
        window.state.currentView = 'farmer-dash';
      } else if (u === 'retailer' || u === 'apex_sourcing') {
        window.state.isLoggedIn = true;
        window.state.currentUser = u;
        window.state.role = 'retailer';
        window.state.displayName = 'Apex Sourcing Ltd.';
        window.state.currentView = 'retailer-dash';
      } else if (u === 'admin') {
        window.state.isLoggedIn = true;
        window.state.currentUser = 'admin';
        window.state.role = 'admin';
        window.state.displayName = 'System Administrator';
        window.state.currentView = 'admin-dash';
      } else {
        window.state.loginError = "Invalid credentials. Please enter a valid username and password.";
      }
      window.renderApp();
    };

        if (placeholder) placeholder.classList.add('hidden');
        if (wrap) wrap.classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    };

              <div class="border border-slate-300 bg-white p-6 space-y-4">
                <div class="flex justify-between items-center border-b border-slate-200 pb-3">
                  <div>
                    <h3 class="font-bold text-sm uppercase text-slate-900">PMFBY CROP INSURANCE CLAIMS LEDGER</h3>
                    <p class="text-xs text-slate-500">Live satellite audit logs, claim match scores & payout status</p>
                  </div>
                  <div class="flex items-center space-x-2">
                    <button onclick="document.getElementById('gis-crop')?.scrollIntoView({behavior:'smooth'})" class="bg-[#064E3B] text-emerald-300 text-xs font-bold px-3 py-1 uppercase border border-emerald-700">+ FILE NEW CLAIM</button>
                    <span class="bg-slate-900 text-white text-xs font-bold px-3 py-1 uppercase">
                      ${window.state.insuranceCases.length} CLAIMS RECORDED
                    </span>
                  </div>
                </div>

                <div class="overflow-x-auto">
                  <table class="w-full text-left border-collapse text-xs">
                    <thead>
                      <tr class="border-b border-slate-300 bg-slate-100 text-slate-700 uppercase">
                        <th class="p-3 border-r border-slate-200">Claim ID</th>
                        <th class="p-3 border-r border-slate-200">Policy & Khasra No</th>
                        <th class="p-3 border-r border-slate-200">Claimant</th>
                        <th class="p-3 border-r border-slate-200">Peril / Cause</th>
                        <th class="p-3 border-r border-slate-200">Satellite Match</th>
                        <th class="p-3 border-r border-slate-200">Calculated Payout</th>
                        <th class="p-3 border-r border-slate-200">72-Hr Notice</th>
                        <th class="p-3 border-r border-slate-200">Status</th>
                        <th class="p-3">Actions</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-200">
                      ${window.state.insuranceCases.map(c => `
                        <tr class="hover:bg-slate-50">
                          <td class="p-3 border-r border-slate-200 font-bold text-slate-900">${c.id}</td>
                          <td class="p-3 border-r border-slate-200 font-mono text-slate-700">${c.policyId}</td>
                          <td class="p-3 border-r border-slate-200 font-bold text-slate-800">${c.farmerName}</td>
                          <td class="p-3 border-r border-slate-200">${c.claimedCause}</td>
                          <td class="p-3 border-r border-slate-200 font-bold text-emerald-800">${c.claimScore}</td>
                          <td class="p-3 border-r border-slate-200 font-bold text-[#064E3B]">₹${c.payoutAmount.toLocaleString('en-IN')}</td>
                          <td class="p-3 border-r border-slate-200 font-bold text-emerald-700">${c.noticeCompliant}</td>
                          <td class="p-3 border-r border-slate-200">
                            <span class="bg-[#064E3B] text-emerald-300 font-bold px-2 py-0.5 text-[10px] uppercase border border-emerald-700">
                              ${c.status}
                            </span>
                          </td>
                          <td class="p-3">
                            <button id="btn-remove-claim-${c.id}" onclick="window.deleteInsuranceClaim('${c.id}', event)" class="bg-red-50 text-red-700 border border-red-300 hover:bg-red-100 px-2 py-1 font-bold text-[10px] uppercase">🗑️ REMOVE</button>
                          </td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              </div>

            </div>
          `;
      }
    }

    window.renderMainViewOnly = function() {
      const mainEl = document.getElementById('main-view');
      if (mainEl) mainEl.innerHTML = buildMainViewHTML();
      if (window.state.currentView === 'insurance-map') {
        setTimeout(() => {
          window.initOrUpdateLeafletMap(window.state.latitude || 30.9010, window.state.longitude || 75.8573);
        }, 150);
      }
      scheduleSupabaseStateSave();
    };

    window.renderApp = function() {
      const sidebarEl = document.getElementById('sidebar-container');
      const topNavEl = document.getElementById('top-nav');
      if (sidebarEl) sidebarEl.innerHTML = buildSidebarHTML();
      if (topNavEl) topNavEl.innerHTML = buildTopNavHTML();
      window.renderMainViewOnly();
    };

    // Initial Launch Execution & API Sync
    document.addEventListener('DOMContentLoaded', function() {
      window.renderApp();
      syncDataFromBackend();
      if (supabaseClient) supabaseClient.auth.getSession().then(({ data, error }) => {
        if (error) { console.error('Could not restore Supabase session:', error.message); return; }
        if (data.session?.user) enterSupabaseSession(data.session.user);
      });
      if (supabaseClient) supabaseClient.auth.onAuthStateChange((event, session) => {
        if (event === 'SIGNED_OUT') { currentSupabaseUserId = null; window.state.isLoggedIn = false; window.state.currentView = 'login'; window.renderApp(); }
        else if (event === 'SIGNED_IN' && session?.user && currentSupabaseUserId !== session.user.id) enterSupabaseSession(session.user);
      });
    });

    window.renderApp();
    syncDataFromBackend();
  </script>
</body>
</html>
