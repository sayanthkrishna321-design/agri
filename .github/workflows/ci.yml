name: Verify AgriSentinel X

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          DEBUG: "True"
      - run: python agrisentinel/agrisentinel/manage.py test core --verbosity 1
        env:
          DEBUG: "True"
      - run: python agrisentinel/agrisentinel/manage.py check
        env:
          DEBUG: "True"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    env:
      # Non-secret placeholders satisfy Compose interpolation in CI only.
      DB_PASSWORD: ci-placeholder-not-for-deployment
      SECRET_KEY: ci-placeholder-not-for-deployment-012345678901234567890123456789
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker build --tag agrisentinel-backend .
      - run: docker build --tag agrisentinel-frontend ./frontend
